<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Hub</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb;
    --muted: #8b93a3; --green: #3ecf8e; --red: #ef5b5b; --amber: #e0a52c; --accent: #4f8ef7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 20px; margin: 0; }
  header .actions { display: flex; gap: 8px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #freshness { padding: 8px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); }
  #freshness.warn { color: var(--amber); }
  #freshness.fail { color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { cursor: pointer; color: var(--muted); font-weight: 600; user-select: none; }
  tr:hover { background: var(--panel); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.pass { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.fail { background: rgba(239,91,91,0.15); color: var(--red); }
  .badge.insider { background: rgba(224,165,44,0.15); color: var(--amber); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-width: 420px; }
  dialog label { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  dialog input { width: 100%; padding: 8px; margin-top: 4px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
  dialog .dialog-actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }
  #empty-state { padding: 40px; text-align: center; color: var(--muted); }
  tr[data-sym] { cursor: pointer; }
  .chart-row td { padding: 0; border-bottom: 1px solid var(--border); }
  .chart-panel { padding: 16px; background: var(--bg); }
  .chart-panel .chart-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .chart-panel canvas { width: 100%; height: 220px; display: block; }
  .chart-panel .chart-status { padding: 24px 0; text-align: center; color: var(--muted); font-size: 13px; }
  .chart-panel .chart-status.error { color: var(--red); }
  .chart-panel .chart-retry { margin-top: 8px; }
  @media (max-width: 600px) {
    .chart-panel canvas { height: 160px; }
  }
</style>
</head>
<body>
<header>
  <h1>Signal Hub</h1>
  <div class="actions">
    <button id="refresh-btn">Refresh</button>
    <button id="settings-btn">Einstellungen</button>
  </div>
</header>
<div id="freshness">Lade...</div>
<div id="table-container">
  <table id="signal-table">
    <thead>
      <tr>
        <th data-sort="sym">Symbol</th>
        <th data-sort="price">Preis</th>
        <th data-sort="template">Template</th>
        <th data-sort="signal">Signal</th>
        <th data-sort="insider">Insider</th>
        <th data-sort="rs">RS vs SPY</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div id="empty-state" style="display:none;">Keine Daten. Einstellungen pruefen (JSONBin Bin ID + Key).</div>
</div>

<dialog id="settings-dialog">
  <h2 style="margin-top:0;">Einstellungen</h2>
  <label>JSONBin Bin ID
    <input id="cfg-bin-id" type="text" placeholder="6512...abc">
  </label>
  <label>JSONBin Read/Master Key
    <input id="cfg-jsonbin-key" type="password" placeholder="$2a$10$...">
  </label>
  <label>GitHub Repo (owner/name)
    <input id="cfg-github-repo" type="text" placeholder="DHachtel/signal-hub">
  </label>
  <label>GitHub PAT (nur "Actions: Read and write" auf diesem Repo)
    <input id="cfg-github-pat" type="password" placeholder="github_pat_...">
  </label>
  <div class="dialog-actions">
    <button id="settings-cancel">Abbrechen</button>
    <button id="settings-save">Speichern</button>
  </div>
</dialog>

<script>
const CFG_KEYS = ['cfg-bin-id', 'cfg-jsonbin-key', 'cfg-github-repo', 'cfg-github-pat'];
const STORAGE_PREFIX = 'signalhub_';

function loadConfig() {
  const cfg = {};
  for (const key of CFG_KEYS) cfg[key] = localStorage.getItem(STORAGE_PREFIX + key) || '';
  return cfg;
}

function saveConfig() {
  for (const key of CFG_KEYS) {
    const el = document.getElementById(key);
    localStorage.setItem(STORAGE_PREFIX + key, el.value.trim());
  }
}

function hasMinimalConfig() {
  const cfg = loadConfig();
  return !!(cfg['cfg-bin-id'] && cfg['cfg-jsonbin-key']);
}

async function fetchDocument() {
  const cfg = loadConfig();
  const url = `https://api.jsonbin.io/v3/b/${cfg['cfg-bin-id']}/latest`;
  const resp = await fetch(url, { headers: { 'X-Master-Key': cfg['cfg-jsonbin-key'] } });
  if (!resp.ok) throw new Error(`JSONBin ${resp.status}`);
  const body = await resp.json();
  return body.record;
}

function fmtAge(generatedAtIso) {
  const diffMs = Date.now() - new Date(generatedAtIso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 60) return `vor ${mins} Min`;
  const hours = Math.round(mins / 60);
  return `vor ${hours} Std`;
}

function renderFreshness(doc) {
  const el = document.getElementById('freshness');
  if (!doc || !doc.meta) {
    el.textContent = 'Keine Daten geladen.';
    el.className = 'fail';
    return;
  }
  const age = fmtAge(doc.meta.generated_at);
  el.textContent = `Zuletzt aktualisiert ${age} — Status: ${doc.meta.run_status}`;
  el.className = doc.meta.run_status === 'ok' ? '' : (doc.meta.run_status === 'partial' ? 'warn' : 'fail');
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderTable(doc) {
  const tbody = document.getElementById('table-body');
  const emptyState = document.getElementById('empty-state');
  tbody.innerHTML = '';
  openChartSym = null;

  const symbols = (doc && doc.symbols) ? doc.symbols : {};
  const rows = Object.entries(symbols);
  if (rows.length === 0) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  for (const [sym, data] of rows) {
    const tr = document.createElement('tr');
    tr.dataset.sym = sym;
    const swing = data.swing || {};
    const insider = data.insider || {};
    const templateBadge = swing.template_pass
      ? '<span class="badge pass">pass</span>' : '<span class="badge fail">fail</span>';
    const signalText = swing.signal === 'buy' ? `buy @ ${swing.entry ?? '-'}` : '–';
    const insiderBadge = insider.cluster_buy ? '<span class="badge insider">Cluster-Buy</span>' : '—';
    const qualityNote = data.data_quality === 'stale'
      ? ` <span title="${escapeHtml(data.data_quality_reason || '')}">⚠️</span>` : '';

    tr.innerHTML = `
      <td>${escapeHtml(sym)}${qualityNote}</td>
      <td>${data.price != null ? '$' + data.price.toFixed(2) : '–'}</td>
      <td>${templateBadge}</td>
      <td>${signalText}</td>
      <td>${insiderBadge}</td>
      <td>${swing.rs_spy != null ? swing.rs_spy.toFixed(1) + '%' : '–'}</td>
    `;
    tbody.appendChild(tr);
  }
}

// ═══════════════════════════════════════════
// CHART PANEL (candlesticks + EMA21, live-fetched per symbol)
// Ported from TechScreener_Pro_v23.html's fetchWithProxy/fetchYahooOHLCV/
// calcEMA, scoped to a fixed 3-month range with EMA21 only.
// ═══════════════════════════════════════════

const CHART_PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://thingproxy.freeboard.io/fetch/',
  'https://api.codetabs.com/v1/proxy?quest='
];

async function fetchWithCorsProxy(url) {
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(4000) });
    if (r.ok) return await r.json();
  } catch (e) {
    // direct fetch failed (likely CORS) — fall through to proxies
  }
  for (const proxy of CHART_PROXIES) {
    try {
      const r = await fetch(proxy + encodeURIComponent(url), { signal: AbortSignal.timeout(5000) });
      if (r.ok) {
        const text = await r.text();
        return JSON.parse(text);
      }
    } catch (e) {
      // try next proxy
    }
  }
  return null;
}

function calcEmaJs(arr, period) {
  const k = 2 / (period + 1);
  const result = new Array(arr.length).fill(null);
  if (arr.length < period) return result;
  const seedEnd = period - 1;
  let sum = 0;
  for (let i = 0; i < period; i++) sum += (arr[i] || 0);
  result[seedEnd] = sum / period;
  for (let i = seedEnd + 1; i < arr.length; i++) {
    result[i] = (arr[i] || 0) * k + result[i - 1] * (1 - k);
  }
  return result;
}

async function fetchChartOHLCV(sym) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=3mo`;
  const raw = await fetchWithCorsProxy(url);
  const result = raw && raw.chart && raw.chart.result && raw.chart.result[0];
  if (!result || !result.timestamp || !result.indicators || !result.indicators.quote) return null;
  const ts = result.timestamp;
  const quote = result.indicators.quote[0];
  const candles = [];
  for (let i = 0; i < ts.length; i++) {
    if (quote.close[i] == null || quote.high[i] == null || quote.low[i] == null || quote.low[i] <= 0) continue;
    candles.push({
      t: ts[i] * 1000,
      o: quote.open[i] != null ? quote.open[i] : quote.close[i],
      h: quote.high[i],
      l: quote.low[i],
      c: quote.close[i],
    });
  }
  if (candles.length < 20) return null;
  const closes = candles.map(c => c.c);
  const ema21 = calcEmaJs(closes, 21);
  candles.forEach((c, i) => { c.ema21 = ema21[i]; });
  return candles;
}

let openChartSym = null;

function closeOpenChartRow() {
  const existing = document.querySelector('tr.chart-row');
  if (existing) existing.remove();
  openChartSym = null;
}

async function toggleChartRow(sym, rowEl) {
  if (openChartSym === sym) {
    closeOpenChartRow();
    return;
  }
  closeOpenChartRow();
  openChartSym = sym;

  const chartRow = document.createElement('tr');
  chartRow.className = 'chart-row';
  chartRow.dataset.sym = sym;
  const td = document.createElement('td');
  td.colSpan = 6;
  td.innerHTML = `
    <div class="chart-panel">
      <div class="chart-title">${escapeHtml(sym)} — 3 Monate, EMA21</div>
      <div class="chart-status">Lade Chart...</div>
    </div>
  `;
  chartRow.appendChild(td);
  rowEl.after(chartRow);

  const panel = td.querySelector('.chart-panel');
  const status = panel.querySelector('.chart-status');

  try {
    const candles = await fetchChartOHLCV(sym);
    if (openChartSym !== sym) return; // user closed/switched while this fetch was in flight
    if (!candles) {
      status.innerHTML = 'Keine ausreichenden Kursdaten verfuegbar.<br><button class="chart-retry">Erneut versuchen</button>';
      status.className = 'chart-status error';
      status.querySelector('.chart-retry').addEventListener('click', () => {
        closeOpenChartRow();
        toggleChartRow(sym, rowEl);
      });
      return;
    }
    status.remove();
    const canvas = document.createElement('canvas');
    panel.appendChild(canvas);
    drawMiniChart(canvas, candles);
  } catch (e) {
    if (openChartSym !== sym) return;
    status.innerHTML = `Fehler beim Laden: ${escapeHtml(e.message)}<br><button class="chart-retry">Erneut versuchen</button>`;
    status.className = 'chart-status error';
    status.querySelector('.chart-retry').addEventListener('click', () => {
      closeOpenChartRow();
      toggleChartRow(sym, rowEl);
    });
  }
}

function drawMiniChart(canvas, candles) {
  const width = canvas.parentElement.clientWidth;
  const height = 220;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const padT = 12, padB = 12, padL = 4, padR = 54;
  const left = padL, right = width - padR, top = padT, bottom = height - padB;
  const n = candles.length;
  const colW = (right - left) / n;
  const bodyW = Math.max(1, colW * 0.6);

  ctx.fillStyle = '#0f1115'; // matches --bg
  ctx.fillRect(0, 0, width, height);

  let minP = Infinity, maxP = -Infinity;
  candles.forEach(c => {
    if (c.h > maxP) maxP = c.h;
    if (c.l < minP) minP = c.l;
    if (c.ema21 != null) {
      if (c.ema21 > maxP) maxP = c.ema21;
      if (c.ema21 < minP) minP = c.ema21;
    }
  });
  const priceRange = (maxP - minP) || 1;
  const py = p => top + (maxP - p) / priceRange * (bottom - top);
  const px = i => left + (i + 0.5) * colW;

  ctx.strokeStyle = '#2a2f3a'; // matches --border
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = top + (bottom - top) * i / 3;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
  }

  ctx.strokeStyle = '#e0a52c'; // matches --amber
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  let started = false;
  candles.forEach((c, i) => {
    if (c.ema21 == null) return;
    const x = px(i), y = py(c.ema21);
    if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
  });
  ctx.stroke();

  candles.forEach((c, i) => {
    const x = px(i);
    const up = c.c >= c.o;
    const color = up ? '#3ecf8e' : '#ef5b5b'; // matches --green / --red
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, py(c.h));
    ctx.lineTo(x, py(c.l));
    ctx.stroke();
    const bodyTop = py(Math.max(c.o, c.c));
    const bodyBottom = py(Math.min(c.o, c.c));
    ctx.fillRect(x - bodyW / 2, bodyTop, bodyW, Math.max(1, bodyBottom - bodyTop));
  });

  ctx.fillStyle = '#8b93a3'; // matches --muted
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  for (let i = 0; i <= 3; i++) {
    const priceVal = maxP - priceRange * i / 3;
    const y = top + (bottom - top) * i / 3;
    ctx.fillText('$' + priceVal.toFixed(2), right + 4, y + 3);
  }
}

document.getElementById('table-body').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-sym]');
  if (!tr || tr.classList.contains('chart-row')) return;
  toggleChartRow(tr.dataset.sym, tr);
});

async function loadAndRender() {
  if (!hasMinimalConfig()) {
    document.getElementById('freshness').textContent = 'Bitte Einstellungen konfigurieren.';
    document.getElementById('empty-state').style.display = 'block';
    return;
  }
  try {
    const doc = await fetchDocument();
    renderFreshness(doc);
    renderTable(doc);
  } catch (e) {
    document.getElementById('freshness').textContent = `Fehler beim Laden: ${e.message}`;
    document.getElementById('freshness').className = 'fail';
  }
}

document.getElementById('settings-btn').addEventListener('click', () => {
  const cfg = loadConfig();
  for (const key of CFG_KEYS) document.getElementById(key).value = cfg[key];
  document.getElementById('settings-dialog').showModal();
});

document.getElementById('settings-cancel').addEventListener('click', () => {
  document.getElementById('settings-dialog').close();
});

document.getElementById('settings-save').addEventListener('click', () => {
  saveConfig();
  document.getElementById('settings-dialog').close();
  loadAndRender();
});

async function triggerWorkflowDispatch() {
  const cfg = loadConfig();
  const [owner, repo] = (cfg['cfg-github-repo'] || '').split('/');
  if (!owner || !repo || !cfg['cfg-github-pat']) {
    throw new Error('GitHub Repo oder PAT fehlt in den Einstellungen');
  }
  const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/signal-hub.yml/dispatches`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${cfg['cfg-github-pat']}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ ref: 'main' }),
  });
  if (resp.status !== 204) {
    throw new Error(`GitHub API ${resp.status}`);
  }
}

async function pollForCompletion(triggeredAt) {
  const cfg = loadConfig();
  const [owner, repo] = (cfg['cfg-github-repo'] || '').split('/');
  const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/signal-hub.yml/runs?per_page=5`;
  const maxAttempts = 12; // 12 * 15s = 3 minutes
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    await new Promise(r => setTimeout(r, 15000));
    try {
      const resp = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${cfg['cfg-github-pat']}`,
          'Accept': 'application/vnd.github+json',
        },
      });
      if (!resp.ok) continue;
      const body = await resp.json();
      const freshRun = (body.workflow_runs || []).find(r =>
        new Date(r.created_at).getTime() >= triggeredAt && r.status === 'completed'
      );
      if (freshRun) return true;
    } catch (e) {
      // transient network error while polling — keep trying until maxAttempts
    }
  }
  return false;
}

document.getElementById('refresh-btn').addEventListener('click', async () => {
  const btn = document.getElementById('refresh-btn');
  const freshnessEl = document.getElementById('freshness');
  btn.disabled = true;
  const originalText = btn.textContent;
  try {
    btn.textContent = 'Starte Scan...';
    const triggeredAt = Date.now();
    await triggerWorkflowDispatch();
    btn.textContent = 'Scan laeuft (~2-3 Min)...';
    freshnessEl.textContent = 'Scan laeuft, bitte warten...';
    const completed = await pollForCompletion(triggeredAt);
    if (completed) {
      btn.textContent = 'Fertig, lade neu...';
      await loadAndRender();
    } else {
      freshnessEl.textContent = 'Scan laeuft laenger als erwartet — spaeter erneut pruefen.';
      freshnessEl.className = 'warn';
    }
  } catch (e) {
    freshnessEl.textContent = `Refresh fehlgeschlagen: ${e.message}`;
    freshnessEl.className = 'fail';
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

loadAndRender();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {
    // Registration failure is non-fatal — the page still works, just not installable.
  });
}
</script>
</body>
</html>
